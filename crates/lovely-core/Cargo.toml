[package]
name = "lovely-core"
version = "0.9.0"
edition = "2021"

[dependencies]
dirs = "5.0.1"
getargs = "0.5.0"
libc = "0.2.153"
libloading = "0.8.3"
toml = "0.8.10"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5.0"
wildmatch = "2.3.0"
log = "0.4.21"
regex-cursor = "0.1.4"
regex-lite = "0.1.5"
chrono = "0.4.38"
serde_ignored = "0.1.10"
itertools = "0.13.0"
crop = "0.4.2"
anyhow = "1.0.100"
# `zip` defaults to enabling every codec (zstd, bzip2, lzma, …), each of
# which drags in a `-sys` crate that compiles C/C++ from source. That's
# painful for cross-compilation to Android (zstd-sys in particular fails
# to find `arm-linux-androideabi-ar`). We only need basic DEFLATE
# read/write, so disable the default features and re-enable just `deflate`.
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
